[build-system]
requires = [
    "pybind11",
    "scikit-build-core>=0.10",
    "torch~=2.12.0",  # WA: must be specified in root project with build-constraint-dependencies
]
build-backend = "scikit_build_core.build"

[project]
name = "fbgemm-xpu"
description = "FBGEMM XPU operators for Intel GPUs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Dmitry Rogozhkin", email = "dmitry.v.rogozhkin@intel.com" },
]
dynamic = ["version"]
dependencies = [
    "torch~=2.12.0",
]

[project.optional-dependencies]
test = [
    "numpy",
    "pytest",
    "hypothesis",
]

[project.urls]
GitHub = "https://github.com/intel/torchlib-xpu"

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = ["src/fbgemm_xpu"]

[tool.scikit-build.cmake.define]
CMAKE_CXX_COMPILER = {env="CXX", default="icpx"}

[[tool.scikit-build.generate]]
path = "src/fbgemm_xpu/_version.py"
template = '__version__ = "${version}"'

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "version.txt"
regex = "^v?(?P<value>[0-9a-zA-Z.+-_]+)"
